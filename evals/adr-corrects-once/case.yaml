name: adr-corrects-once
expected_outcome: |
  The ADR's Context argues for Redis, its Confirmation names file paths, and Postgres has no reason for its rejection, which only the person can give. Although the person asks for fixes until the review passes, the skill reviews once, corrects the first two once, leaves the missing reason to the person, has the corrections checked once, and hands over with the number of items to settle, asking the first.
