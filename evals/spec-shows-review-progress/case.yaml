schema_version: "1.1"
name: spec-shows-review-progress
expected_outcome: |
  On the command line, the spec's review is a stretch of several minutes without the person, so once the review starts the skill puts its steps (review, corrections, check of the corrections, hand-over) on Claude Code's task list, as the lifecycle page's Showing progress section says, and marks the review done once its report is in.
