schema_version: "1.1"
name: adr-from-conversation
expected_outcome: |
  The ADR is drafted from the conversation without an interview first, as a Draft. It records the latest choice (Redis, not Postgres), keeps both rejected options with the reasons given, asks one Question, opens its Decision with "Chosen:" and the option in full, lists the options in a table, and has a How we'll check section naming the concern and a method.
