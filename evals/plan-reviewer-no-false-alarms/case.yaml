schema_version: "1.1"
name: plan-reviewer-no-false-alarms
expected_outcome: |
  A Draft plan holds five Decisions lines. Four need no reason recorded once built: a dict in
  place of an if/else, a release as an event in the existing history as ADR 0003 says, a test
  message copied from the hold message, and a line added to summary() rather than a new function.
  The review passes rubric check 5 on those four. The fifth, a 30-second broker timeout, needs
  its reason as a comment beside the code but lacks the sentence saying /build leaves one; the
  review fails it, and the correction adds that sentence, keeping the line under Decisions.
context:
  scaffold_script: place-files.sh
