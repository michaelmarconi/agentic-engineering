schema_version: "1.1"
name: spec-fixes-flaws
expected_outcome: |
  The skill has the spec reviewed and fixes what the rubric catches: the Story stops naming the solution and asks for the real situation instead of inventing one, Out of scope names something, each requirement has one EARS rule with SHALL, examples add real cases, How we'll check names a carried-out method with a stand-in for the payment gateway and an inspection for the look, vague words get measures or become questions, and the sections are back in order. What only the person can decide is left as an open question, not invented.
context:
  scaffold_script: place-files.sh
