schema_version: "1.1"
name: spike-site-under-test-not-input
expected_outcome: |
  The experiment tests how the importer's download step treats a site whose certificate has
  expired. That address is the system under test, not a file to keep a copy of, so it is not
  listed under Inputs, which the run script downloads before every run; the record still names
  it in How the test works or the Code. Issue #74: listing it under Inputs stopped every run with
  a certificate error before the experiment started.
context:
  scaffold_script: place-files.sh
