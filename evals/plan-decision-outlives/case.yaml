schema_version: "1.1"
name: plan-decision-outlives
expected_outcome: |
  The person gives four decisions already agreed for one requirement. Three outlive the plan: a
  fake broker that later tests reuse (an ADR), the answer shape a dashboard reads (the spec) and a
  check by hand run before every pull request (practices). Each becomes an open question naming
  that document, not a line under Decisions. The fourth, a retry wait, stays under Decisions and
  says /build leaves its reason as a comment beside the code.
context:
  scaffold_script: place-files.sh
---
tags: [plan]
max_turns: 60
timeout_seconds: 1200
allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Agent]
