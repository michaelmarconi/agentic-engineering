name: brief-no-references
expected_outcome: |
  The person asks for the brief to link to the court booking spec and to an ADR, and for junior members to be out of scope. The brief gets no hyperlink, path or title of the spec or the ADR, adds junior members to Out of scope, keeps everything else, and the reply tells the person the references were left out because those documents can change or be deleted without the brief being touched, so the references would go stale.
