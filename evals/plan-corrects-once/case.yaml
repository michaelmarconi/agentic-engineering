schema_version: "1.1"
name: plan-corrects-once
expected_outcome: |
  The plan has a code block and refers to the brief, which the skill can correct, and makes a decision nobody agreed (a new Redis cache), which only the person can settle. Although the person asks for fixes until the review passes, the skill reviews once, corrects the first two once, writes the Redis choice into the plan's Open questions for the person, has the corrections checked once, and hands over with the number of items to settle, asking the first.
context:
  scaffold_script: place-files.sh
