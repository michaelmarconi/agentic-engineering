schema_version: "1.1"
name: issue-corrects-once
expected_outcome: |
  A brought-back draft that the person insists keeps their internal host fails its review. Whether
  to share the host is the person's decision, so the skill reviews once, files nothing, runs at
  most one correction check, and shows the person what is still failing, giving the number of
  items to settle and asking the first.
context:
  scaffold_script: place-files.sh
