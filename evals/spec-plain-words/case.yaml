schema_version: "1.1"
name: spec-plain-words
expected_outcome: |
  The person talks in their team's shorthand: a nickname ("ghost refunds"), a figure of speech
  ("slip through the net") and a payments term ("chargeback"). The spec keeps the meaning but
  says each in plain words, footnoting the payments term where it first appears, and the
  language checker reviews it beside the spec reviewer.
