[project]
name = "booklog"
version = "0.3.0"
description = "Keep a log of the books you read, from the command line."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
booklog = "booklog.cli:main"

[dependency-groups]
dev = ["ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
